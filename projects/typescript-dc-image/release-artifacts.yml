artifacts:
  # Bare name; registry host/namespace come from .publish/registries.yml,
  # composing to ghcr.io/cpdevtools/dcm-images-devcontainers/typescript-dc-image.
  - type: docker-image
    name: typescript-dc-image
    # The tag `pnpm run build` produces locally; git-flow saves it at pack
    # and pushes it as <version> plus latest/next at publish.
    localTag: typescript-dc-image:latest
    registries:
      - ghcr
